version: '3.8'

services:

  postgres:
    container_name: postgres
    image: postgres:13
    environment:
      POSTGRES_DB: job_genee_backend
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    ports:
      - "5434:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin-data:/var/lib/pgadmin

  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
  
  minio-client:
    image: minio/mc:latest
    container_name: minio-client
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc config host rm expo;
      /usr/bin/mc config host add --quiet --api s3v4 local http://minio:9000 minio minio123;
      /usr/bin/mc mb --quiet local/job_genee_backend/;
      /usr/bin/mc policy set public local/job_genee_backend;
      tail -f /dev/null;
      "
    depends_on:
      - minio

  redis:
    container_name: redis
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/var/lib/redis

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    ports:
      - 5540:5540
    volumes:
      - redisinsight-data:/data
    depends_on:
      - redis

  job_genee_backend:
    container_name: job_genee_backend
    restart: on-failure
    build:
      context: .
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_DB=job_genee_backend
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=postgres
      - REDIS_URL=redis://redis:6379/1
      - MINIO_ACCESS_KEY=minio
      - MINIO_SECRET_KEY=minio123
      - MINIO_BUCKET_NAME=job_genee_backend
      - MINIO_URL=http://minio:9000
      - CONTEXT_PATH=api/v1
    depends_on:
      - postgres
      - minio
      - redis
      
volumes:
  kafka-data:
  postgres-data:
  pgadmin-data:
  minio-data:
  redis-data:
  redisinsight-data: